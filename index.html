/* ============================ actions ============================ */
document.addEventListener('click', e => {
  const nb = e.target.closest('nav button');
  if (nb) { view = nb.dataset.view; render(); window.scrollTo(0, 0); return; }
  if (e.target.id === 'netpill') {
    if (!online()) { view = 'settings'; render(); }
    else if (!cloud.pin) pinModal();
    else { toast(net.msg); tick(); }
    return;
  }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;

  switch (a) {
    case 'go': view = b.dataset.view; render(); window.scrollTo(0, 0); break;
    case 'closemod': closeModal(); break;
    case 'doconfirm': { const f = pendingConfirm; pendingConfirm = null; closeModal(); if (f) f(); break; }
    case 'dopin': tryPin(); break;
    case 'closescorer': closeScorer(); break;

    /* ---- games ---- */
    case 'togg': openGames[id] = !(openGames[id] !== undefined ? openGames[id]
                                    : (gameById(id) || {}).status !== 'done'); render(); break;
    case 'addgame': if (!guard()) break; gameModal(null); break;
    case 'editgame': gameModal(id); break;
    case 'savegame': {
      if (!guard()) break;
      const nm = ($('#gn').value || '').trim(), ic = ($('#gi').value || '').trim();
      const note = ($('#gnote').value || '').trim();
      if (id) { const g = gameById(id); if (g) { g.name = nm || g.name; g.icon = ic; g.note = note; syncGame(g); } }
      else { const g = addGame(nm, ic); g.note = note; syncGame(g); view = 'games'; }
      save(); closeModal(); render(); break;
    }
    case 'delgame': {
      const g = gameById(id); if (!g) break;
      confirmModal('Delete ' + esc(g.name) + '?',
        'Every score in it goes too, the games after it renumber, and anyone it knocked out comes back in.',
        'Delete game', () => { delGame(id); render(); toast('Game deleted'); });
      break;
    }
    case 'scoregame': openScorer(id); break;
    case 'gonext': curGame = id; paintScorer(); break;
    case 'step': {
      const g = b.dataset.g, t = b.dataset.t, d = Number(b.dataset.d);
      const now = cell(g, t) || 0;
      setCell(g, t, now + d);
      if (b.closest('#scorer')) paintScorer();
      else {
        const inp = document.querySelector('.gcard input[data-g="' + g + '"][data-t="' + t + '"]');
        if (inp) inp.value = now + d;
        repaintGame(g);
      }
      break;
    }

    /* ---- lock / unlock ---- */
    case 'lockfrom': closeScorer();      // fall through to the same dialog
    case 'lock': {
      if (!guard()) break;
      const g = gameById(id); if (!g) break;
      if (state.rules.confirm === false) lockGame(g, elimPreview(g).picks.map(x => x.t.id));
      else lockModal(id);
      break;
    }
    case 'dolock': {
      const g = gameById(id); if (!g) break;
      const ids = Array.prototype.slice.call($('#modal').querySelectorAll('[data-elim]'))
        .filter(c => c.checked).map(c => c.dataset.elim);
      if (ids.length >= state.teams.filter(t => inGame(t, g)).length) { toast('You cannot eliminate every team'); break; }
      closeModal(); lockGame(g, ids); break;
    }
    case 'unlock': {
      if (!guard()) break;
      const g = gameById(id); if (!g) break;
      confirmModal('Reopen ' + esc(g.name) + '?',
        (g.elim && g.elim.length
          ? esc(g.elim.map(teamName).join(' and ')) + ' come back in and the scores become editable again.'
          : 'The scores become editable again.'),
        'Reopen game', () => unlockGame(g));
      break;
    }

    /* ---- teams ---- */
    case 'addteam': if (!guard()) break; teamModal(null); break;
    case 'editteam': teamModal(id); break;
    case 'bulkteams': if (!guard()) break; bulkModal(); break;
    case 'dobulk': {
      const lines = ($('#bulk').value || '').split('\n').map(s => s.trim()).filter(Boolean);
      let n = 0;
      lines.forEach(nm => {
        if (state.teams.some(t => t.name.toLowerCase() === nm.toLowerCase())) return;
        const t = { id: uid(), name: nm, color: PALETTE[state.teams.length % PALETTE.length],
                    emoji: '', members: '', out: null, sort: state.teams.length };
        state.teams.push(t); syncTeam(t); n++;
      });
      save(); closeModal(); render(); toast(n ? n + ' team' + (n === 1 ? '' : 's') + ' added' : 'Nothing new to add');
      break;
    }
    case 'saveteam': {
      const nm = ($('#tn').value || '').trim();
      if (!nm) { toast('Give the team a name'); break; }
      const col = ($('#tc').querySelector('button.on') || {}).dataset;
      const emo = ($('#te').value || '').trim(), mem = ($('#tm').value || '').trim();
      if (id) {
        const t = teamById(id);
        if (t) { t.name = nm; t.emoji = emo; t.members = mem; if (col) t.color = col.c; syncTeam(t); }
      } else {
        const t = { id: uid(), name: nm, emoji: emo, members: mem,
                    color: col ? col.c : PALETTE[state.teams.length % PALETTE.length],
                    out: null, sort: state.teams.length };
        state.teams.push(t); syncTeam(t);
      }
      save(); closeModal(); render(); break;
    }
    case 'revive': {
      const t = teamById(id); if (!t) break;
      const g = games().find(x => (x.elim || []).indexOf(id) >= 0);
      if (g) { g.elim = g.elim.filter(x => x !== id); syncGame(g); }
      t.out = null; syncTeam(t); save(); closeModal(); render();
      toast(t.name + ' is back in');
      break;
    }
    case 'delteam': {
      const t = teamById(id); if (!t) break;
      confirmModal('Remove ' + esc(t.name) + '?', 'Every score they have is deleted with them.',
        'Remove team', () => { delTeam(id); render(); toast('Team removed'); });
      break;
    }

    /* ---- settings ---- */
    case 'saveevent': {
      if (!guard()) break;
      state.event.name = ($('#evname').value || '').trim() || 'Fun Games';
      state.event.tagline = ($('#evtag').value || '').trim();
      save(); syncConfig(); render(); toast('Saved');
      break;
    }
    case 'basis': if (!guard()) break; state.rules.basis = b.dataset.v; save(); syncConfig(); render(); break;
    case 'dir':   if (!guard()) break; state.rules.direction = b.dataset.v; save(); syncConfig(); render(); break;
    case 'saverules': {
      if (!guard()) break;
      const n = parseInt($('#pergame').value, 10);
      state.rules.perGame = isFinite(n) ? Math.max(0, Math.min(5, n)) : 1;
      save(); syncConfig(); render(); toast('Rules saved');
      break;
    }

    /* ---- cloud ---- */
    case 'ctest': connTest(); break;
    case 'retry': net.rev = ''; tick(); toast('Retrying…'); break;
    case 'connect': {
      const url = ($('#cu').value || '').trim(), key = ($('#ck').value || '').trim();
      if (!url || !key) { toast('Project URL and anon key are both needed'); break; }
      cloud.url = normUrl(url); cloud.key = key;
      const pin = ($('#cp').value || '').trim(); if (pin) cloud.pin = pin;
      saveCloud(); net.rev = ''; render(); netPaint(); tick();
      toast('Connected'); break;
    }
    case 'disconnect':
      confirmModal('Disconnect this device?', 'The board stays in the database. This device falls back to its own local copy.',
        'Disconnect', () => { cloud = {}; saveCloud(); outbox = []; saveOutbox();
          net = { state: 'off', msg: 'Local only', rev: '' }; render(); netPaint(); toast('Disconnected'); });
      break;
    case 'unlock-pin': pinModal(); break;
    case 'upload': uploadLocal(); break;
    case 'viewlink':   copyText(location.origin + location.pathname + '#s=' + encCfg(false), 'Watch link copied'); break;
    case 'scorerlink': copyText(location.origin + location.pathname + '#s=' + encCfg(true),  'Scorer link copied — it carries the passcode'); break;

    /* ---- data ---- */
    case 'export': {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a2 = document.createElement('a');
      a2.href = URL.createObjectURL(blob);
      a2.download = 'gauntlet-' + new Date().toISOString().slice(0, 10) + '.json';
      a2.click(); setTimeout(() => URL.revokeObjectURL(a2.href), 1000);
      toast('Backup downloaded'); break;
    }
    case 'import': {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'application/json';
      inp.onchange = () => {
        const f = inp.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          try { state = migrate(JSON.parse(rd.result)); save(); render(); toast('Backup restored'); }
          catch (err) { toast('That file could not be read'); }
        };
        rd.readAsText(f);
      };
      inp.click(); break;
    }
    case 'restart':
      if (!guard()) break;
      confirmModal('Clear all scores?', 'Teams and games stay. Every score is wiped and every team comes back in.',
        'Clear scores', () => {
          state.scores = {};
          state.teams.forEach(t => { t.out = null; });
          state.games.forEach(g => { g.status = 'active'; g.elim = []; g.lockedAt = 0; });
          save();
          if (online() && cloud.pin) enqueue('gauntlet_restart', { p_pin: cloud.pin }, 'restart');
          render(); toast('Scores cleared');
        });
      break;
    case 'wipe':
      if (!guard()) break;
      confirmModal('Delete everything?', 'Teams, games and scores — all of it, on this device and in the database.',
        'Delete everything', () => {
          const wasOnline = online() && cloud.pin;
          outbox = []; saveOutbox();
          state = clone(DEFAULTS); save();
          if (wasOnline) enqueue('gauntlet_reset', { p_pin: cloud.pin }, 'reset');
          render(); toast('Everything deleted');
        });
      break;
  }
});

/* score cells — patch derived numbers on input, full re-render on commit */
document.addEventListener('input', e => {
  const el = e.target;
  if (!el.dataset || !el.dataset.g || !el.dataset.t) return;
  if (!guard()) { el.value = ''; return; }
  const raw = el.value.trim();
  setCell(el.dataset.g, el.dataset.t, raw === '' ? null : Number(raw));
  if (!el.closest('#scorer')) repaintGame(el.dataset.g);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.elim) { el.closest('.pick').classList.toggle('on', el.checked); return; }
  if (el.dataset && el.dataset.g && el.dataset.t && !el.closest('#scorer')) repaintGame(el.dataset.g);
});
/* Enter moves to the next team — the way you actually read scores off a sheet */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('#modal').classList.contains('hide')) { closeModal(); return; }
    if (!$('#scorer').classList.contains('hide')) { closeScorer(); return; }
  }
  const el = e.target;
  if (e.key !== 'Enter' || !el.dataset || !el.dataset.g) return;
  const all = Array.prototype.slice.call(
    (el.closest('#scorer') || el.closest('.gcard') || document)
      .querySelectorAll('input[data-g="' + el.dataset.g + '"]'));
  const i = all.indexOf(el);
  if (i >= 0 && i < all.length - 1) { e.preventDefault(); all[i + 1].focus(); all[i + 1].select(); }
});

/* present mode */
$('#presentBtn').addEventListener('click', () => {
  document.body.classList.toggle('present');
  if (document.body.classList.contains('present')) {
    view = 'board'; render();
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    toast('Present mode — press the button again to exit');
  } else {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    render();
  }
});

/* toast + confetti */
function toast(msg){
  const d = document.createElement('div');
  d.className = 'tst'; d.textContent = msg;
  $('#toast').appendChild(d);
  setTimeout(() => { d.style.opacity = '0'; d.style.transition = 'opacity .3s'; setTimeout(() => d.remove(), 320); }, 2200);
}
function confetti(){
  const cols = ['#f59e0b', '#fbbf24', '#22d3ee', '#a78bfa', '#34d399', '#fb7185'];
  for (let i = 0; i < 90; i++) {
    const d = document.createElement('div');
    d.className = 'cf';
    d.style.background = cols[i % cols.length];
    d.style.left = (10 + Math.random() * 80) + 'vw';
    d.style.top = '-20px';
    d.style.opacity = '1';
    document.body.appendChild(d);
    const x = (Math.random() - .5) * 320, y = window.innerHeight + 60, r = Math.random() * 900;
    d.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 },
               { transform: 'translate(' + x + 'px,' + y + 'px) rotate(' + r + 'deg)', opacity: 0 }],
      { duration: 1600 + Math.random() * 900, easing: 'cubic-bezier(.2,.6,.4,1)' }).onfinish = () => d.remove();
  }
}

/* ============================ boot ============================ */
const fromLink = applyHashCfg();
render();
netPaint();
if (online()) { tick(); setInterval(tick, 4000); }
if (fromLink) toast(cloud.pin ? 'Connected — scoring unlocked on this device'
                              : 'Connected to the shared board');
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
window.addEventListener('online', tick);
window.addEventListener('resize', () => { if (view === 'board') fitStage(); });
</script>
</body>
