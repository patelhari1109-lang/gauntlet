<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="author" content="Hari Patel">
<meta name="description" content="Elimination scoreboard for a fun games event — score every team in every game, knock one out each round, last team standing wins. Built by Hari Patel.">
<title>Gauntlet — Elimination Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f17; --panel:#121a26; --panel2:#172131; --line:#243147; --line2:#31425e;
  --tx:#e9eff8; --mut:#8fa0b8; --mut2:#61728c;
  --acc:#f59e0b; --acc2:#a78bfa; --good:#34d399; --warn:#fbbf24; --bad:#fb7185;
  --r:14px; --sh:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 600px at 12% -10%, #2a1f16 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #1e1a33 0%, transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--tx); font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding-bottom:60px;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);
  background:rgba(11,15,23,.82);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.03em}
.brand .dot{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#a78bfa);box-shadow:0 0 14px #f59e0b}
.brand small{display:block;font-size:10.5px;font-weight:500;color:var(--mut2);letter-spacing:.14em;text-transform:uppercase;line-height:1}
nav{display:flex;gap:2px;margin-left:auto;background:var(--panel);border:1px solid var(--line);padding:4px;border-radius:11px}
nav button{padding:7px 13px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--mut)}
nav button:hover{color:var(--tx)}
nav button.on{background:var(--panel2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
  display:grid;place-items:center;font-size:15px;color:var(--mut)}
.iconbtn:hover{color:var(--tx);border-color:var(--line2)}
@media(max-width:700px){
  .top .wrap{height:auto;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
  nav{order:3;width:100%;margin-left:0;overflow-x:auto}
  nav button{flex:1;white-space:nowrap}
}

/* ---------- generic ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.sec-head{display:flex;align-items:center;gap:10px;margin:26px 0 12px;flex-wrap:wrap}
.sec-head h2{font-size:17px}
.sec-head .sub{color:var(--mut2);font-size:12.5px;font-weight:500}
.sec-head .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:9px 15px;border-radius:10px;background:var(--panel2);border:1px solid var(--line2);
  font-weight:600;font-size:13.5px;color:var(--tx);transition:.12s}
.btn:hover{background:#1e2b3f}
.btn.pri{background:linear-gradient(135deg,#f59e0b,#f0740b);border-color:transparent;color:#231202;
  box-shadow:0 6px 18px rgba(245,158,11,.26)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.gho{background:transparent;border-color:var(--line)}
.btn.dgr{color:var(--bad);border-color:#4a2733;background:transparent}
.btn.dgr:hover{background:#2a1720}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(245,158,11,.15)}
label.f{display:block}
label.f span{display:block;font-size:11.5px;font-weight:600;color:var(--mut2);
  text-transform:uppercase;letter-spacing:.09em;margin-bottom:5px}
.grid{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  font-size:11.5px;font-weight:600;border:1px solid var(--line2);background:var(--panel2);color:var(--mut)}
.chip.live{border-color:#7f5a2d;background:#2a2116;color:#fbbf24}
.chip.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fbbf24;animation:pulse 1.2s infinite}
.chip.done{border-color:#1f4a3a;background:#122a22;color:#4ade80}
.chip.out{border-color:#7f2d3c;background:#2a1620;color:#ff8fa3}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.empty{text-align:center;padding:38px 16px;color:var(--mut2);font-size:14px}
.empty .big{font-size:30px;margin-bottom:8px;opacity:.5}
.muted{color:var(--mut2)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:700;color:var(--mut2);text-transform:uppercase;
  letter-spacing:.09em;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid rgba(36,49,71,.55);font-size:14px}
tr:last-child td{border-bottom:none}
th.r,td.r{text-align:right}
th.c,td.c{text-align:center}
.scroll{overflow-x:auto}

/* ---------- champion ---------- */
.champ{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--acc);
  background:var(--panel);padding:26px 20px;text-align:center;margin-bottom:14px}
.champ::before{content:"";position:absolute;inset:0;opacity:.18;
  background:radial-gradient(520px 220px at 50% 0%,var(--c,#f59e0b),transparent 70%)}
.champ>*{position:relative}
.champ .lbl{font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--acc)}
.champ .nm{font-size:clamp(30px,7vw,52px);font-weight:800;letter-spacing:-.04em;margin:6px 0 2px;
  display:flex;align-items:center;justify-content:center;gap:12px}
.champ .sub{color:var(--mut);font-size:13.5px}

/* ---------- 16:9 stage ----------
   The dashboard is designed once, at 1600x900, and then scaled to whatever
   screen it lands on — a projector, a TV in the corner, a laptop. Everything
   fits the frame, so nothing scrolls and nothing is cut off. Narrow screens
   drop the stage and stack the same panels normally, because a letterboxed
   16:9 strip on a phone would be unreadable.                                 */
.stagewrap{position:relative;width:100%}
.stagewrap.on{overflow:hidden}
.stagewrap.on .stage{position:absolute;top:0;left:0;width:1600px;height:900px;
  transform-origin:top left;display:flex;flex-direction:column;gap:16px}
.dashhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dashhead .ev{min-width:0}
.dashhead .ev b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.dashhead .ev span{font-size:13px;color:var(--mut2);font-weight:500}
.dashhead .chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.dash{display:flex;gap:16px;align-items:stretch;min-height:0}
.stagewrap.on .dash{flex:1}
.dash .main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.dash .main .card{flex:1;min-height:0;display:flex;flex-direction:column}
.dash .main .scroll{flex:1;min-height:0;overflow:auto}
.dash .rail{width:360px;flex:none;display:flex;flex-direction:column;gap:12px;min-height:0}
@media(max-width:900px){
  .dash{flex-direction:column}
  .dash .rail{width:auto}
}

/* ---------- leader rail ---------- */
.lead{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--line);
  background:var(--panel);padding:16px}
.lead::before{content:"";position:absolute;inset:0;opacity:.15;
  background:radial-gradient(420px 180px at 12% 0%,var(--c),transparent 70%)}
.lead.first{border-color:var(--c)}
.lead>*{position:relative}
.lead .cap{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut2)}
.lead .nm{font-size:22px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:9px;margin-top:4px}
.lead .nm i{width:10px;height:10px;border-radius:50%;background:var(--c);font-style:normal;flex:none}
.lead .tot{font-size:38px;font-weight:800;letter-spacing:-.045em;line-height:1.1;margin-top:2px}
.lead .tot small{font-size:12.5px;font-weight:600;color:var(--mut2);letter-spacing:0;margin-left:6px}
.bar{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:10px 0 0}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.chase{display:flex;flex-direction:column;gap:1px;border-radius:14px;overflow:hidden;
  border:1px solid var(--line);background:var(--panel)}
.crow{display:flex;align-items:center;gap:10px;padding:9px 13px;font-size:14px}
.crow+.crow{border-top:1px solid rgba(36,49,71,.55)}
.crow .p{width:18px;color:var(--mut2);font-weight:700;font-variant-numeric:tabular-nums}
.crow .nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:8px}
.crow .nm i{width:8px;height:8px;border-radius:50%;font-style:normal;flex:none}
.crow .v{font-weight:800;font-variant-numeric:tabular-nums}
.crow.gone{opacity:.55}
.panel{border-radius:14px;border:1px solid var(--line);background:var(--panel);padding:13px 14px}
.panel .cap{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mut2);margin-bottom:9px}
.panel.warn{border-color:#7f2d3c;background:#1d1418}

/* ---------- stat strip ---------- */
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.rail .stats{grid-template-columns:1fr 1fr}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.04em;line-height:1.15}
.stat span{font-size:10.5px;color:var(--mut2);font-weight:600;text-transform:uppercase;letter-spacing:.09em}

/* ---------- survival grid ---------- */
.sgrid td,.sgrid th{white-space:nowrap}
.sgrid .tm{display:flex;align-items:center;gap:9px;font-weight:600}
.sgrid .tm i{width:9px;height:9px;border-radius:50%;font-style:normal;flex:none}
.sgrid tr.gone .tm{color:var(--mut2)}
.sgrid tr.gone .tm i{opacity:.45}
.cell{display:inline-flex;min-width:44px;justify-content:center;padding:3px 8px;border-radius:8px;
  font-weight:700;font-variant-numeric:tabular-nums;background:var(--panel2);border:1px solid var(--line)}
.cell.best{border-color:#1f4a3a;background:#122a22;color:#4ade80}
.cell.worst{border-color:#7f2d3c;background:#2a1620;color:#ff8fa3}
.cell.none{background:transparent;border-color:transparent;color:var(--mut2);font-weight:500}
.cell.dead{background:transparent;border-color:transparent;color:var(--mut2);opacity:.5}
.rk{font-variant-numeric:tabular-nums;font-weight:700;color:var(--mut2);width:26px}
.tot{font-variant-numeric:tabular-nums;font-weight:800;font-size:16px}

/* ---------- game cards ---------- */
.gcard{border-radius:14px;border:1px solid var(--line);background:var(--panel);overflow:hidden;margin-bottom:12px}
.gcard.act{border-color:#7f5a2d}
.ghead{display:flex;align-items:center;gap:12px;padding:14px 16px;flex-wrap:wrap}
.gtoggle{flex:1;display:flex;align-items:center;gap:12px;text-align:left;min-width:0}
.gtoggle:hover .nm{color:#fff}
.ghead .ix{width:38px;height:38px;flex:none;border-radius:10px;background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--mut)}
.gcard.act .ghead .ix{border-color:#7f5a2d;background:#2a2116;color:#fbbf24}
.ghead .mid{flex:1;min-width:0}
.ghead .nm{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ghead .meta{font-size:12px;color:var(--mut2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbody{border-top:1px solid var(--line);padding:14px 16px}
.zoneflag{font-size:10.5px;font-weight:700;color:#ff8fa3;letter-spacing:.06em;text-transform:uppercase}
.outlist{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.outpill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;
  border:1px solid #7f2d3c;background:#2a1620;color:#ff8fa3;font-size:12.5px;font-weight:600}

/* ---------- full-screen scorer ---------- */
.ov{position:fixed;inset:0;z-index:100;background:#080b12;display:flex;flex-direction:column;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ov.hide{display:none}
.ovtop{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex:none}
.ovtop .t{font-weight:700;font-size:15px}
.ovtop .s{font-size:12px;color:var(--mut2)}
.ovbody{flex:1;overflow:auto;padding:12px 16px 20px}
.srow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;background:var(--panel);
  border:1px solid var(--line);margin-bottom:9px}
.srow.zone{border-color:#7f2d3c}
.srow.dead{opacity:.5}
.srow .pos{width:20px;flex:none;text-align:right;font-weight:700;color:var(--mut2);font-size:13px}
.srow .nm{flex:1;min-width:0;font-weight:600;display:flex;align-items:center;gap:9px}
.srow .nm i{width:9px;height:9px;border-radius:50%;font-style:normal;flex:none}
.srow .stp{width:42px;height:42px;flex:none;border-radius:11px;border:1px solid var(--line2);
  background:var(--panel2);font-size:19px;font-weight:700;display:grid;place-items:center}
.srow .stp:active{transform:scale(.94)}
.srow input{width:76px;text-align:center;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;
  padding:7px 4px;flex:none}
.ovbot{flex:none;padding:10px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- modal ---------- */
.mod{position:fixed;inset:0;z-index:90;background:rgba(6,9,15,.72);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .16s}
@media(min-width:640px){.mod{align-items:center}}
.mod.hide{display:none}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:18px 18px 0 0;
  width:100%;max-width:520px;max-height:92vh;overflow:auto;box-shadow:var(--sh);animation:up .2s cubic-bezier(.2,.8,.2,1)}
@media(min-width:640px){.sheet{border-radius:18px}}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
.sheet .hd{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--panel);z-index:2}
.sheet .hd h3{font-size:16px}
.sheet .bd{padding:18px;display:grid;gap:13px}
.sheet .ft{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;
  position:sticky;bottom:0;background:var(--panel)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line2);padding:4px;border-radius:10px}
.seg button{flex:1;padding:7px;border-radius:7px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--panel2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
.tog{display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 0}
.tog input{width:auto;margin:0}
.tog div{flex:1}
.tog b{display:block;font-size:14px;font-weight:600}
.pick{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel2);cursor:pointer;margin-bottom:8px}
.pick.on{border-color:#7f2d3c;background:#2a1620}
.pick input{width:auto;margin:0;flex:none}
.pick .nm{flex:1;font-weight:600;display:flex;align-items:center;gap:8px}
.pick .nm i{width:9px;height:9px;border-radius:50%;font-style:normal;flex:none}
.pick .v{font-weight:800;font-variant-numeric:tabular-nums}
.warnbox{border:1px solid #7f5a2d;background:#2a2116;color:#fbbf24;border-radius:11px;padding:10px 12px;font-size:13px}

/* ---------- teams ---------- */
.tgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.tcard{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:13px;background:var(--panel);
  border:1px solid var(--line)}
.tcard.gone{opacity:.6;border-style:dashed}
.tcard .av{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:18px;
  background:var(--panel2);border:1px solid var(--line)}
.tcard .mid{flex:1;min-width:0}
.tcard .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .meta{font-size:12px;color:var(--mut2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .x{color:var(--mut2);font-size:15px;padding:4px 7px;border-radius:7px;flex:none}
.tcard .x:hover{color:var(--bad);background:#2a1720}
.swatch{display:flex;gap:7px;flex-wrap:wrap}
.swatch button{width:26px;height:26px;border-radius:8px;border:2px solid transparent}
.swatch button.on{border-color:var(--tx)}

/* ---------- toast + confetti ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:grid;gap:8px;
  justify-items:center;pointer-events:none}
.tst{background:#1c2635;border:1px solid var(--line2);padding:10px 18px;border-radius:99px;font-size:13.5px;
  font-weight:600;box-shadow:var(--sh);animation:up .2s}
.cf{position:fixed;width:9px;height:14px;z-index:300;pointer-events:none;border-radius:2px}

/* ---------- sync pill ---------- */
.netpill{padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel);
  font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--mut);white-space:nowrap}
.netpill.ok{color:#4ade80;border-color:#1f4a3a;background:#122a22}
.netpill.busy{color:var(--warn);border-color:#4a3d1f;background:#26200f}
.netpill.error{color:#ff8fa3;border-color:#7f2d3c;background:#2a1620}
.tline{font-size:13px;padding:4px 0;color:var(--mut)}
.tline.good{color:#4ade80}
.tline.bad{color:#ff8fa3}
.cloudbox{display:grid;gap:11px}

/* ---------- credit ---------- */
.credit{margin:40px auto 8px;text-align:center;font-size:11.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--mut2);opacity:.5;transition:opacity .2s;font-weight:500}
.credit:hover{opacity:.9}
.credit b{font-weight:600;color:var(--mut)}

/* ---------- present mode ---------- */
body.present .top nav,body.present .sec-head .sp,body.present .noprsnt{display:none}
body.present .top,body.present .credit{display:none}
body.present{padding-bottom:0}
body.present .wrap{padding:0}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><span class="dot"></span><div>Gauntlet<small>Elimination</small></div></div>
    <nav>
      <button data-view="board" class="on">Standings</button>
      <button data-view="games">Games</button>
      <button data-view="teams">Teams</button>
      <button data-view="settings">Settings</button>
    </nav>
    <button class="netpill off" id="netpill" title="Sync status">○ Local</button>
    <button class="iconbtn" id="presentBtn" title="Present mode (big screen)">⛶</button>
  </div>
</header>

<main class="wrap" id="view"></main>
<footer class="credit wrap">Gauntlet · Designed &amp; built by <b>Hari Patel</b></footer>

<div class="ov hide" id="scorer"></div>
<div class="mod hide" id="modal"></div>
<div id="toast"></div>

<script>
"use strict";
/* ============================ state ============================ */
const KEY = 'gauntlet.v1';
const uid = () => Math.random().toString(36).slice(2, 9);
const $  = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const PALETTE = ['#f59e0b','#22d3ee','#a78bfa','#34d399','#fb7185','#60a5fa',
                 '#f472b6','#facc15','#4ade80','#c084fc','#38bdf8','#fb923c'];

const DEFAULTS = {
  version: 2,
  event: { name: 'Fun Games', tagline: 'Last team standing' },
  /* basis     — what decides who goes out: this game's score, or the running total
     perGame   — how many teams are knocked out at the end of each game
     direction — 'high' = high score is good, 'low' = low score is good (times, penalties)
     confirm   — show the elimination preview before it is applied                */
  rules: { basis: 'game', perGame: 1, direction: 'high', confirm: true },
  teams: [],   // { id, name, color, emoji, members, out, sort }  out = the game idx it went out on
  games: [],   // { id, idx, name, icon, note, status, elim[], lockedAt }
  scores: {}   // 'gameId|teamId' -> number
};

let state = load();
let view = 'board';
let openGames = {};         // which game cards are expanded

function clone(o){ return JSON.parse(JSON.stringify(o)); }

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (e) { console.warn('load failed', e); }
  return clone(DEFAULTS);
}

/* Version 1 nested games inside rounds and eliminated a team per round. Games
   are the only layer now, so an old save is flattened in play order and each
   round's eliminations land on the last game of that round — which is exactly
   when they happened.                                                         */
function flattenRounds(s){
  const rs = (s.rounds || []).slice().sort((a, b) => a.idx - b.idx);
  const flat = [], lastOf = {};
  rs.forEach(r => {
    (s.games || []).filter(g => g.roundId === r.id)
      .sort((a, b) => (a.sort || 0) - (b.sort || 0))
      .forEach(g => {
        flat.push({ id: g.id, idx: flat.length + 1, name: g.name, icon: g.icon || '',
                    note: r.note || '', status: r.status, elim: [], lockedAt: r.lockedAt || 0 });
        lastOf[r.id] = flat[flat.length - 1];
      });
    // a round with no games at all still has to keep its place
    if (!lastOf[r.id]) {
      flat.push({ id: r.id, idx: flat.length + 1, name: r.name, icon: '', note: r.note || '',
                  status: r.status, elim: [], lockedAt: r.lockedAt || 0 });
      lastOf[r.id] = flat[flat.length - 1];
    }
    if (r.elim && r.elim.length) lastOf[r.id].elim = r.elim.slice();
  });
  const idxOfRound = {};
  rs.forEach(r => { idxOfRound[r.idx] = lastOf[r.id] ? lastOf[r.id].idx : null; });
  (s.teams || []).forEach(t => { if (t.out != null) t.out = idxOfRound[t.out] || t.out; });
  s.games = flat;
  delete s.rounds;
  return s;
}

function migrate(s){
  const d = clone(DEFAULTS);
  if (!s || typeof s !== 'object') return d;
  if (Array.isArray(s.rounds) && s.rounds.length) s = flattenRounds(s);
  s.version = 2;
  s.event   = Object.assign({}, d.event, s.event || {});
  /* Read the old rules before the defaults are merged in, or `perGame` is
     already filled with its default and the saved `perRound` looks redundant. */
  const savedRules = s.rules || {};
  s.rules = Object.assign({}, d.rules, savedRules);
  if (s.rules.basis === 'round') s.rules.basis = 'game';
  if (savedRules.perGame == null && savedRules.perRound != null) s.rules.perGame = savedRules.perRound;
  delete s.rules.perRound;
  s.teams   = Array.isArray(s.teams) ? s.teams : [];
  s.games   = Array.isArray(s.games) ? s.games : [];
  s.scores  = (s.scores && typeof s.scores === 'object') ? s.scores : {};
  s.teams.forEach((t, i) => { if (t.sort == null) t.sort = i; if (t.out === undefined) t.out = null; });
  s.games.forEach((g, i) => {
    if (g.idx == null) g.idx = i + 1;
    if (!Array.isArray(g.elim)) g.elim = [];
    if (!g.status) g.status = 'active';
    delete g.roundId; delete g.sort;
  });
  return s;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){ toast('Storage full — export a backup'); } }

/* ============================ cloud sync ============================ */
/* Optional Supabase backend. Without it the app runs on localStorage alone.
   With it, every device sees the same board — the projector, the host's phone,
   and every player watching from their own seat.
   The key held in the page is read-only by design: all writes go through
   passcode-checked RPCs (see supabase-setup.sql), so a player who reads the
   page source still cannot edit a score or revive their own team. Local storage
   stays the working copy, so a dropped wifi connection never interrupts
   scoring — edits queue in an outbox and flush when the network returns.      */
const CKEY = 'gauntlet.cloud', OKEY = 'gauntlet.outbox';
const readLS = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch(e){ return d; } };
let cloud  = readLS(CKEY, {});
let outbox = readLS(OKEY, []);
let net = { state: 'off', msg: 'Local only', rev: '' };   // off | ok | busy | error
let flushing = false, pulling = false;

const online  = () => !!(cloud.url && cloud.key);
const canEdit = () => !online() || !!cloud.pin;
const saveCloud  = () => localStorage.setItem(CKEY, JSON.stringify(cloud));
const saveOutbox = () => localStorage.setItem(OKEY, JSON.stringify(outbox));

/* People paste the project URL out of the Supabase dashboard, an email, or a
   phone keyboard that helpfully capitalised it. Without a scheme the browser
   treats it as a path on the page's own host and every request 404s against
   GitHub Pages, which looks exactly like an unreachable database — so the
   cleanup happens here, once, for every way a URL can get in.               */
function normUrl(u){
  u = String(u == null ? '' : u).trim().replace(/\s+/g, '');
  if (!u) return '';
  u = u.replace(/^https?:\/\//i, m => m.toLowerCase());
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  u = u.replace(/\/+$/, '');
  u = u.replace(/\/rest\/v1$/i, '');       // pasted from the API docs
  return u.replace(/\/+$/, '');
}

/* What actually went wrong, in words the person can act on. */
function apiFail(r){
  if (r.status === 401 || r.status === 403)
    return 'The key was rejected — copy the anon public key from Project Settings → API';
  if (r.status === 404)
    return 'Tables not found — run supabase-setup.sql in the Supabase SQL editor';
  if (r.status === 400)
    return 'The database is out of date — re-run supabase-setup.sql to upgrade it';
  return 'The project answered ' + r.status;
}
const hostOf = () => String(cloud.url || '').replace(/^https?:\/\//, '') || 'the database';

function api(path, opts){
  return fetch(String(cloud.url).replace(/\/+$/, '') + '/rest/v1/' + path, Object.assign({
    headers: { apikey: cloud.key, Authorization: 'Bearer ' + cloud.key,
               'Content-Type': 'application/json', Accept: 'application/json' }
  }, opts || {}));
}
const rpc = (fn, args) => api('rpc/' + fn, { method: 'POST', body: JSON.stringify(args || {}) });

/* ---- row <-> app object mapping ---- */
const rowToTeam = r => ({ id: r.id, name: r.name, color: r.color || PALETTE[0], emoji: r.emoji || '',
  members: r.members || '', out: r.out_game == null ? null : r.out_game, sort: r.sort || 0 });
const teamPayload = t => ({ id: t.id, name: t.name, color: t.color || '', emoji: t.emoji || '',
  members: t.members || '', out: t.out == null ? '' : t.out, sort: t.sort || 0 });

const rowToGame = r => ({ id: r.id, idx: r.idx, name: r.name, icon: r.icon || '', note: r.note || '',
  status: r.status, elim: Array.isArray(r.elim) ? r.elim : [], lockedAt: r.locked_at || 0 });
const gamePayload = g => ({ id: g.id, idx: g.idx, name: g.name, icon: g.icon || '', note: g.note || '',
  status: g.status, elim: g.elim || [], lockedAt: g.lockedAt || '' });

/* ---- outbox: survives a refresh, coalesces rapid taps on one cell ---- */
function enqueue(fn, args, key){
  if (!online()) return;
  if (key) outbox = outbox.filter(j => j.k !== key);
  outbox.push({ fn: fn, args: args, k: key || null });
  saveOutbox(); netPaint(); flush();
}
const syncTeam    = t  => enqueue('gauntlet_upsert_team', { p_pin: cloud.pin, p: teamPayload(t) }, 't:' + t.id);
const syncDelTeam = id => enqueue('gauntlet_delete_team', { p_pin: cloud.pin, p_id: id }, 'dt:' + id);
const syncGame    = g  => enqueue('gauntlet_upsert_game', { p_pin: cloud.pin, p: gamePayload(g) }, 'g:' + g.id);
const syncDelGame = id => enqueue('gauntlet_delete_game', { p_pin: cloud.pin, p_id: id }, 'dg:' + id);
const syncScore   = (gid, tid, v) => enqueue('gauntlet_set_score',
  { p_pin: cloud.pin, p_game: gid, p_team: tid, p_value: v }, 's:' + gid + '|' + tid);
const syncConfig  = () => enqueue('gauntlet_save_config', { p_pin: cloud.pin,
  p: { event: state.event, rules: state.rules } }, 'cfg');

async function flush(){
  if (flushing || !online() || !cloud.pin || !outbox.length) return;
  flushing = true; net.state = 'busy'; netPaint();
  while (outbox.length) {
    const job = outbox[0];
    job.args.p_pin = cloud.pin;                       // always send the current passcode
    try {
      const r = await rpc(job.fn, job.args);
      if (!r.ok) {
        const body = await r.text();
        if (r.status === 401 || r.status === 403 || /passcode/i.test(body)) {
          cloud.pin = ''; saveCloud();
          net.state = 'error'; net.msg = 'Passcode rejected — sign in again';
          flushing = false; netPaint(); render(); return;
        }
        throw new Error(body);
      }
      outbox.shift(); saveOutbox();
    } catch (e) {
      net.state = 'error';
      net.msg = outbox.length + ' change' + (outbox.length === 1 ? '' : 's') + ' waiting to sync';
      flushing = false; netPaint(); return;
    }
  }
  flushing = false; net.state = 'ok'; net.msg = 'Synced'; netPaint();
}

async function pull(){
  if (!online() || pulling) return;
  pulling = true;
  try {
    const [cfg, teams, games, scores] = await Promise.all([
      api('gauntlet_config?select=*&id=eq.1').then(r => r.json()),
      api('gauntlet_teams?select=*').then(r => r.json()),
      api('gauntlet_games?select=*').then(r => r.json()),
      api('gauntlet_scores?select=*').then(r => r.json())
    ]);
    if (Array.isArray(cfg) && cfg[0]) {
      state.event = Object.assign({}, DEFAULTS.event, cfg[0].event || {});
      state.rules = Object.assign({}, DEFAULTS.rules, cfg[0].rules || {});
    }
    /* Anything still queued locally is newer than what the server can tell me,
       so it must survive the merge. */
    const heldT = new Set(outbox.filter(j => /upsert_team$/.test(j.fn)).map(j => j.args.p.id));
    if (Array.isArray(teams)) {
      const mine = {}; state.teams.forEach(t => { if (heldT.has(t.id)) mine[t.id] = t; });
      state.teams = teams.map(r => mine[r.id] || rowToTeam(r));
      Object.keys(mine).forEach(id => { if (!state.teams.some(t => t.id === id)) state.teams.push(mine[id]); });
    }
    const heldG = new Set(outbox.filter(j => /upsert_game$/.test(j.fn)).map(j => j.args.p.id));
    if (Array.isArray(games)) {
      const mine = {}; state.games.forEach(g => { if (heldG.has(g.id)) mine[g.id] = g; });
      state.games = games.map(r => mine[r.id] || rowToGame(r));
      Object.keys(mine).forEach(id => { if (!state.games.some(g => g.id === id)) state.games.push(mine[id]); });
    }
    if (Array.isArray(scores)) {
      const pending = {};
      outbox.filter(j => /set_score$/.test(j.fn))
            .forEach(j => { pending[j.args.p_game + '|' + j.args.p_team] = j.args.p_value; });
      const next = {};
      scores.forEach(r => { next[r.game_id + '|' + r.team_id] = Number(r.value); });
      Object.keys(pending).forEach(k => {
        if (pending[k] == null) delete next[k]; else next[k] = pending[k];
      });
      state.scores = next;
    }
    save();
    if (net.state !== 'busy') { net.state = 'ok'; net.msg = 'Synced'; }
  } catch (e) {
    net.state = 'error'; net.msg = 'Cannot reach ' + hostOf() + ' — check the URL and your connection';
  }
  pulling = false; netPaint();
  if (curGame && !$('#scorer').classList.contains('hide')) paintScorer(); else render();
}

async function tick(){
  if (!online()) return;
  await flush();
  try {
    const r = await rpc('gauntlet_revision');
    if (!r.ok) {
      // the project answered, so this is a setup problem, not a network one
      net.state = 'error';
      net.msg = r.status === 404
        ? 'Connected, but the sync functions are missing — run supabase-setup.sql'
        : apiFail(r);
      netPaint(); return;
    }
    const rev = JSON.stringify(await r.json());
    if (rev !== net.rev) { net.rev = rev; await pull(); }
    else if (net.state === 'error' && !outbox.length) { net.state = 'ok'; net.msg = 'Synced'; netPaint(); }
  } catch (e) {
    if (!outbox.length) {
      net.state = 'error';
      net.msg = 'Cannot reach ' + hostOf() + ' — check the URL and your connection';
      netPaint();
    }
  }
}

function netPaint(){
  const el = $('#netpill'); if (!el) return;
  if (!online()) { el.className = 'netpill off'; el.textContent = '○ Local';
    el.title = 'Not connected to a database — data stays on this device'; return; }
  const s = net.state;
  el.className = 'netpill ' + s;
  el.textContent = s === 'error' ? '⚠ ' + (outbox.length || '') : s === 'busy' ? '◍' : cloud.pin ? '● Live' : '👁 View';
  el.title = net.msg + (cloud.pin ? '' : ' · viewing only — tap to enter the scorer passcode');
}

/* The connection is per-device, which is miserable to retype on a phone. A
   setup link carries the project URL and anon key in the fragment, so a scorer
   or the projector just opens it. The fragment never reaches the server, and it
   is stripped from the address bar once applied. The passcode is deliberately
   left out unless you explicitly ask for a scorer link.                       */
function encCfg(withPin){
  const o = { u: cloud.url, k: cloud.key };
  if (withPin && cloud.pin) o.p = cloud.pin;
  return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/, '');
}
function applyHashCfg(){
  const m = /[#&]s=([A-Za-z0-9+/=_-]+)/.exec(location.hash || '');
  if (!m) return false;
  try {
    const o = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if (!o.u || !o.k) return false;
    cloud.url = normUrl(o.u); cloud.key = String(o.k || '').trim();
    if (o.p) cloud.pin = o.p;
    saveCloud();
    history.replaceState(null, '', location.pathname + location.search);
    return true;
  } catch (e) { return false; }
}
function copyText(t, msg){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(function(){ toast(msg); },
                                         function(){ window.prompt('Copy this link:', t); });
  } else window.prompt('Copy this link:', t);
}

async function tryPin(){
  const v = ($('#pin').value || '').trim();
  if (!v) return;
  try {

}
/* Guard every write path in one place, so a spectator tapping something just
   gets the passcode prompt instead of a silent no-op. */
function guard(){
  if (canEdit()) return true;
  pinModal('That needs the scorer passcode.');
  return false;
}

/* One-time upload of whatever is already on this device. */
async function uploadLocal(){
  if (!cloud.pin) { pinModal('Enter the passcode to upload this device’s data.'); return; }
  toast('Uploading…');
  syncConfig();
  state.teams.forEach(syncTeam);
  state.games.forEach(syncGame);
  Object.keys(state.scores).forEach(k => {
    const p = k.split('|'); syncScore(p[0], p[1], state.scores[k]);
  });
  await flush();
  if (!outbox.length) { net.rev = ''; await tick(); toast('Uploaded to the database'); }
}

async function connTest(){
  const box = $('#ctest'); if (!box) return;
  // usable both before connecting (reads the form) and after (reads the saved
  // settings), because "it stopped working" needs diagnosing far more often
  // than "it never started"
  const url = $('#cu') ? normUrl($('#cu').value) : cloud.url;
  const key = $('#ck') ? ($('#ck').value || '').trim() : cloud.key;
  if (!url || !key) { box.innerHTML = '<div class="tline bad">✗ Fill in both the project URL and the anon key.</div>'; return; }
  const prev = { url: cloud.url, key: cloud.key };
  cloud.url = url; cloud.key = key;
  box.innerHTML = '<div class="tline">◍ Testing ' + esc(url.replace(/^https?:\/\//, '')) + '…</div>';
  const lines = [];
  const put = (ok, t) => { lines.push('<div class="tline ' + (ok ? 'good' : 'bad') + '">' + (ok ? '✓' : '✗') + ' ' + t + '</div>');
    box.innerHTML = lines.join(''); };
  try {
    const r = await api('gauntlet_config?select=id&id=eq.1');
    if (r.status === 404) { put(false, 'Reached the project, but the tables are missing — run supabase-setup.sql first.'); throw 0; }
    if (!r.ok) { put(false, 'Project answered ' + r.status + ' — check the anon key.'); throw 0; }
    const rows = await r.json();
    put(true, 'Project reachable and tables present.');
    put(Array.isArray(rows) && rows.length > 0, Array.isArray(rows) && rows.length
      ? 'Config row found.' : 'Config row missing — re-run the seed at the end of supabase-setup.sql.');
    const rv = await rpc('gauntlet_revision');
    put(rv.ok, rv.ok ? 'Sync functions installed.' : 'Functions missing — re-run supabase-setup.sql.');

    // a project set up against the first version of this app answers every
    // check above and still cannot be written to, so name that case exactly
    const sch = await api('gauntlet_games?select=idx&limit=1');
    const tsc = await api('gauntlet_teams?select=out_game&limit=1');
    put(sch.ok && tsc.ok, sch.ok && tsc.ok
      ? 'Schema is up to date.'
      : 'Schema is the older rounds-based one — re-run supabase-setup.sql to upgrade it (your scores are kept).');
    const pin = ($('#cp').value || '').trim();
    if (pin) {
      const vr = await rpc('gauntlet_verify_pin', { p_pin: pin });
      const ok = vr.ok && (await vr.json()) === true;
      put(ok, ok ? 'Passcode accepted.' : 'Passcode rejected — check the value you set in the SQL.');
    } else lines.push('<div class="tline">○ No passcode entered — you can add it later to score.</div>'), box.innerHTML = lines.join('');
  } catch (e) {
    if (!lines.length) put(false, 'Could not reach that URL at all. Check for typos.');
  }
  cloud.url = prev.url; cloud.key = prev.key;
}

/* ============================ lookups ============================ */
const teamById  = id => state.teams.find(t => t.id === id);
const gameById  = id => state.games.find(g => g.id === id);
const teamName  = id => (teamById(id) || {}).name || '—';

const bySort = (a, b) => (a.sort || 0) - (b.sort || 0);
const games  = () => state.games.slice().sort((a, b) => a.idx - b.idx);
const teams  = () => state.teams.slice().sort(bySort);
const alive  = () => state.teams.filter(t => t.out == null).sort(bySort);

const activeGame = () => games().find(g => g.status !== 'done') || null;
const doneGames  = () => games().filter(g => g.status === 'done');

/* A team is "in" a game if it had not yet been eliminated when that game was
   played — which is what makes an old game's card still show the right rows. */
const inGame = (t, g) => t.out == null || t.out >= g.idx;

/* ============================ scoring ============================ */
/* Every number on this board is derived from the score cells. Nothing is
   stored twice, so correcting a typo three games later instantly re-ranks
   the whole event.                                                           */
const cellKey = (gid, tid) => gid + '|' + tid;
function cell(gid, tid){
  const v = state.scores[cellKey(gid, tid)];
  return v == null ? null : Number(v);
}
function setCell(gid, tid, v){
  const k = cellKey(gid, tid);
  if (v == null || v === '' || !isFinite(v)) { delete state.scores[k]; syncScore(gid, tid, null); }
  else { state.scores[k] = Number(v); syncScore(gid, tid, Number(v)); }
  save();
}
/* A blank cell is not the same as a zero — "hasn't played yet" vs "scored
   nothing" — so the score of a game always travels with whether it is set. */
function gameScore(g, tid){
  const v = cell(g.id, tid);
  return { v: v == null ? 0 : v, any: v != null };
}
function totalScore(tid, uptoIdx){
  return games().reduce((s, g) =>
    (uptoIdx == null || g.idx <= uptoIdx) ? s + gameScore(g, tid).v : s, 0);
}

/* Sorting a pool from best to worst under the current direction rule. */
const better = (a, b) => state.rules.direction === 'low' ? a - b : b - a;

/* ---- standings ----
   Alive teams rank above eliminated ones. Among the eliminated, surviving
   longer beats a big score in an early game — that is what an elimination
   event actually rewards. Score breaks ties inside each group.               */
function standings(){
  return teams().map(t => ({ t: t, total: totalScore(t.id), out: t.out }))
    .sort((a, b) => {
      if ((a.out == null) !== (b.out == null)) return a.out == null ? -1 : 1;
      if (a.out != null && a.out !== b.out) return b.out - a.out;
      return better(a.total, b.total);
    }).map((row, i) => (row.rank = i + 1, row));
}

/* Live order within one game — used for the position number on each row, the
   elimination-zone highlight, and the preview in the lock dialog. */
function gameOrder(g){
  const pool = state.teams.filter(t => inGame(t, g)).sort(bySort);
  const val  = t => state.rules.basis === 'total' ? totalScore(t.id, g.idx) : gameScore(g, t.id).v;
  return pool.map(t => ({ t: t, v: val(t), has: gameScore(g, t.id).any }))
             .sort((a, b) => better(a.v, b.v) || bySort(a.t, b.t));
}

/* Who the rules say goes out at the end of this game.
   Never empties the board: with N teams left it can only take N-1.
   `tie` is true when the cut line falls between two equal scores, which is the
   one case a host must resolve themselves — a tie-break game, or a coin.      */
function elimPreview(g){
  const order = gameOrder(g);                      // best first
  const rev   = order.slice().reverse();           // worst first
  const n     = Math.max(0, Math.min(state.rules.perGame || 1, order.length - 1));
  const picks = rev.slice(0, n);
  const tie   = n > 0 && rev.length > n && rev[n].v === rev[n - 1].v;
  return { order: order, worstFirst: rev, picks: picks, n: n, tie: tie,
           unscored: order.filter(o => !o.has).length };
}

/* ============================ mutations ============================ */
function addGame(name, icon){
  const idx = (games().slice(-1)[0] || { idx: 0 }).idx + 1;
  const g = { id: uid(), idx: idx, name: name || ('Game ' + idx), icon: icon || '',
              note: '', status: 'active', elim: [], lockedAt: 0 };
  state.games.push(g); save(); syncGame(g);
  openGames[g.id] = true;
  return g;
}
function clearGameScores(gid){
  Object.keys(state.scores).forEach(k => { if (k.split('|')[0] === gid) delete state.scores[k]; });
}
/* Deleting a game leaves a hole in the numbering, so everything after it
   shifts down — including the round number recorded against every team that
   was knocked out later, or the survival grid would point at the wrong game. */
function delGame(id){
  const g = gameById(id); if (!g) return;
  const gone = g.idx;
  clearGameScores(id);
  state.games = state.games.filter(x => x.id !== id);
  state.games.forEach(x => { if (x.idx > gone) { x.idx--; syncGame(x); } });
  state.teams.forEach(t => {
    if (t.out == null) return;
    if (t.out === gone) { t.out = null; syncTeam(t); }        // its elimination goes with it
    else if (t.out > gone) { t.out--; syncTeam(t); }
  });
  save(); syncDelGame(id);
}
function delTeam(id){
  Object.keys(state.scores).forEach(k => { if (k.split('|')[1] === id) delete state.scores[k]; });
  state.teams = state.teams.filter(t => t.id !== id);
  state.games.forEach(g => {
    if ((g.elim || []).indexOf(id) >= 0) { g.elim = g.elim.filter(x => x !== id); syncGame(g); }
  });
  save(); syncDelTeam(id);
}

/* Locking a game is the only thing here that is genuinely hard to undo by
   hand, so it is the one thing that always asks first. */
function lockGame(g, ids){
  ids.forEach(id => { const t = teamById(id); if (t) { t.out = g.idx; syncTeam(t); } });
  g.status = 'done'; g.elim = ids.slice(); g.lockedAt = Date.now();
  syncGame(g); save();

  const left = alive();
  if (left.length > 1 && !games().some(x => x.status !== 'done')) addGame();
  render();
  if (left.length === 1) { confetti(); toast(left[0].name + ' wins the gauntlet!'); }
  else if (ids.length) toast(ids.map(teamName).join(' & ') + ' eliminated');
  else toast('Game locked — nobody went out');
}
function unlockGame(g){
  (g.elim || []).forEach(id => { const t = teamById(id); if (t && t.out === g.idx) { t.out = null; syncTeam(t); } });
  g.status = 'active'; g.elim = []; g.lockedAt = 0;
  syncGame(g); save(); openGames[g.id] = true; render();
  toast(g.name + ' reopened');
}

/* ============================ render ============================ */
function render(){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  $('#view').innerHTML =
    view === 'games'    ? vGames()    :
    view === 'teams'    ? vTeams()    :
    view === 'settings' ? vSettings() : vBoard();
  netPaint();
  if (view === 'board') fitStage();
}

const dot = t => '<i style="background:' + esc(t.color || '#64748b') + '"></i>';
const nfmt = n => (Math.round(n * 100) / 100).toString();
const label = g => (g.icon ? esc(g.icon) + ' ' : '') + esc(g.name);

/* ---------- standings ----------
   Laid out as a 16:9 dashboard: the survival grid takes the floor, and a rail
   down the right carries the leader, the count, and whoever is about to go
   out. It is designed at 1600x900 and scaled to fit, so the same screen works
   on a projector and on a laptop.                                            */
function vBoard(){
  if (!state.teams.length) {
    return '<div class="card empty" style="margin-top:24px"><div class="big">🎪</div>' +
      '<div><b>' + esc(state.event.name) + '</b> has no teams yet.</div>' +
      '<div style="margin-top:12px"><button class="btn pri" data-act="go" data-view="teams">Add the teams</button></div></div>';
  }

  const gs = games(), done = doneGames(), act = activeGame();
  const st = standings(), left = alive();
  const champ = left.length === 1 && done.length ? left[0] : null;

  /* ---- header ---- */
  let h = '<div class="stagewrap" id="stagewrap"><div class="stage" id="stage">' +
    '<div class="dashhead"><div class="ev"><b>' + esc(state.event.name) + '</b>' +
      (state.event.tagline ? '<span>' + esc(state.event.tagline) + '</span>' : '') + '</div>' +
    '<div class="chips">' +
      (champ ? '<span class="chip done">complete</span>'
             : act ? '<span class="chip live">Game ' + act.idx + ' · ' + label(act) + '</span>'
                   : '<span class="chip">no game open</span>') +
      '<span class="chip">' + done.length + ' of ' + gs.length + ' played</span>' +
      '<span class="chip">' + left.length + ' still in</span>' +
    '</div></div>';

  h += '<div class="dash">';

  /* ---- the survival grid ---- */
  h += '<div class="main"><div class="card"><div class="scroll"><table class="sgrid"><thead><tr>' +
    '<th style="width:26px"></th><th>Team</th>' +
    gs.map(g => '<th class="c" title="' + esc(g.name) + '">' + (g.icon ? esc(g.icon) : 'G' + g.idx) +
      (g.status === 'done' ? '' : ' <span style="color:var(--warn)">•</span>') + '</th>').join('') +
    '<th class="r">Total</th><th class="r">Status</th></tr></thead><tbody>';

  /* best/worst per game, so a column reads at a glance */
  const stats = {};
  gs.forEach(g => {
    const vals = state.teams.filter(t => inGame(t, g)).map(t => gameScore(g, t.id))
                            .filter(x => x.any).map(x => x.v);
    stats[g.id] = vals.length ? { hi: Math.max.apply(null, vals), lo: Math.min.apply(null, vals) } : null;
  });

  h += st.map(s => {
    const t = s.t;
    return '<tr class="' + (t.out != null ? 'gone' : '') + '">' +
      '<td class="rk num">' + s.rank + '</td>' +
      '<td><span class="tm">' + dot(t) + (t.emoji ? esc(t.emoji) + ' ' : '') + esc(t.name) + '</span></td>' +
      gs.map(g => {
        if (!inGame(t, g)) return '<td class="c"><span class="cell dead">–</span></td>';
        const v = gameScore(g, t.id), s2 = stats[g.id];
        let cls = 'cell';
        if (!v.any) cls += ' none';
        else if (s2 && s2.hi !== s2.lo) {
          const good = state.rules.direction === 'low' ? s2.lo : s2.hi;
          const bad  = state.rules.direction === 'low' ? s2.hi : s2.lo;
          if (v.v === good) cls += ' best'; else if (v.v === bad) cls += ' worst';
        }
        const knocked = (g.elim || []).indexOf(t.id) >= 0;
        return '<td class="c"><span class="' + cls + '">' + (v.any ? nfmt(v.v) : '·') + '</span>' +
               (knocked ? ' <span title="eliminated here">💀</span>' : '') + '</td>';
      }).join('') +
      '<td class="r tot num">' + nfmt(s.total) + '</td>' +
      '<td class="r">' + (t.out == null
        ? '<span class="chip done">In</span>'
        : '<span class="chip out">G' + t.out + '</span>') + '</td></tr>';
  }).join('');

  h += '</tbody></table></div></div></div>';

  /* ---- rail ---- */
  h += '<div class="rail">';

  const max = Math.max(1, ...st.map(s => Math.abs(s.total)));
  if (champ) {
    h += '<div class="champ" style="--c:' + esc(champ.color) + ';margin:0">' +
      '<div class="lbl">Last team standing</div>' +
      '<div class="nm">' + (champ.emoji ? esc(champ.emoji) + ' ' : '') + esc(champ.name) + '</div>' +
      '<div class="sub">Survived all ' + done.length + ' game' + (done.length === 1 ? '' : 's') +
        ' · ' + nfmt(totalScore(champ.id)) + ' points</div></div>';
  } else if (st.length) {
    const s0 = st[0], t0 = s0.t;
    h += '<div class="lead first" style="--c:' + esc(t0.color) + '">' +
      '<div class="cap">Leading</div>' +
      '<div class="nm">' + dot(t0) + (t0.emoji ? esc(t0.emoji) + ' ' : '') + esc(t0.name) + '</div>' +
      '<div class="tot num">' + nfmt(s0.total) + '<small>pts</small></div>' +
      '<div class="bar"><i style="width:' + Math.max(3, Math.abs(s0.total) / max * 100) + '%"></i></div>' +
      '</div>';
  }

  /* the chasing pack — enough of the table to read at a glance from the back
     of the room, without making the rail a second copy of the grid */
  const chase = st.slice(champ ? 0 : 1, champ ? 5 : 5);
  if (chase.length) h += '<div class="chase">' + chase.map(s =>
    '<div class="crow' + (s.t.out != null ? ' gone' : '') + '">' +
      '<span class="p num">' + s.rank + '</span>' +
      '<span class="nm">' + dot(s.t) + (s.t.emoji ? esc(s.t.emoji) + ' ' : '') + esc(s.t.name) + '</span>' +
      (s.t.out != null ? '<span class="chip out">G' + s.t.out + '</span>' : '') +
      '<span class="v num">' + nfmt(s.total) + '</span></div>').join('') + '</div>';

  h += '<div class="stats">' +
    '<div class="stat"><b class="num">' + left.length + '</b><span>Still in</span></div>' +
    '<div class="stat"><b class="num">' + (state.teams.length - left.length) + '</b><span>Eliminated</span></div>' +
    '<div class="stat"><b class="num">' + done.length + '<span style="font-size:14px;color:var(--mut2)"> / ' + gs.length + '</span></b><span>Games played</span></div>' +
    '<div class="stat"><b class="num">' + (champ ? '—' : (act ? act.idx : '—')) + '</b><span>Now playing</span></div>' +
    '</div>';

  /* who is in the drop zone, live, while the game is still running */
  if (act && !champ) {
    const p = elimPreview(act);
    const scored = p.order.filter(o => o.has).length;
    h += '<div class="panel' + (p.picks.length && scored ? ' warn' : '') + '">' +
      '<div class="cap">' + (p.picks.length && scored ? 'On the chopping block' : 'Game ' + act.idx) + '</div>' +
      (p.picks.length && scored
        ? '<div class="outlist" style="margin:0">' + p.picks.map(x =>
            '<span class="outpill">' + (x.t.emoji ? esc(x.t.emoji) + ' ' : '') + esc(x.t.name) +
            ' · <b class="num">' + nfmt(x.v) + '</b></span>').join('') +
          (p.tie ? '<span class="chip" style="margin-left:8px">tied — host decides</span>' : '') + '</div>'
        : '<div class="muted" style="font-size:13px">' + scored + ' of ' + p.order.length +
          ' teams scored in ' + label(act) + '</div>') +
      '<div class="row noprsnt" style="margin-top:11px"><button class="btn sm" data-act="go" data-view="games">Enter scores</button></div>' +
      '</div>';
  }

  h += '</div></div></div></div>';
  return h;
}

/* The stage is a fixed 1600x900 box scaled to whatever room the page has.
   Transform does not affect layout, so the wrapper is given the resulting
   height by hand, and the stage is centred in whatever is left over.        */
const STAGE_W = 1600, STAGE_H = 900;
function stageFits(){
  return document.body.classList.contains('present') ||
         (window.innerWidth >= 900 && window.innerHeight >= 500);
}
function fitStage(){
  const wrap = $('#stagewrap'), st = $('#stage');
  if (!wrap || !st) return;
  if (!stageFits()) {
    wrap.classList.remove('on');
    wrap.style.height = ''; st.style.transform = ''; st.style.left = '';
    return;
  }
  wrap.classList.add('on');
  const availW = wrap.clientWidth;
  const top    = wrap.getBoundingClientRect().top;
  const pad    = document.body.classList.contains('present') ? 0 : 16;
  const availH = Math.max(240, window.innerHeight - top - pad);
  const scale  = Math.min(availW / STAGE_W, availH / STAGE_H);
  st.style.transform = 'scale(' + scale + ')';
  st.style.left = Math.max(0, (availW - STAGE_W * scale) / 2) + 'px';
  wrap.style.height = (STAGE_H * scale) + 'px';
}

/* ---------- games ---------- */
function vGames(){
  const gs = games();
  let h = '<div class="sec-head"><h2>Games</h2><span class="sub">' +
    (gs.length ? gs.length + ' game' + (gs.length === 1 ? '' : 's') + ' · ' + alive().length + ' teams still in'
               : 'one game, one elimination — add them as you go or all up front') +
    '</span><span class="sp"><button class="btn pri" data-act="addgame">+ Game</button></span></div>';

  if (!state.teams.length)
    return h + '<div class="card empty"><div class="big">👥</div><div>Add teams before you can score a game.</div>' +
      '<div style="margin-top:12px"><button class="btn" data-act="go" data-view="teams">Go to teams</button></div></div>';
  if (!gs.length)
    return h + '<div class="card empty"><div class="big">🎯</div><div>No games yet.</div>' +
      '<div style="margin-top:12px"><button class="btn pri" data-act="addgame">Add the first game</button></div></div>';

  return h + gs.map(gameCard).join('');
}

function gameCard(g){
  const act  = g.status !== 'done';
  const open = openGames[g.id] !== undefined ? openGames[g.id] : act;
  const p    = elimPreview(g);
  const zone = {};
  if (act) p.picks.forEach(x => { if (x.has) zone[x.t.id] = true; });
  const scored = p.order.filter(o => o.has).length;

  let h = '<div class="gcard' + (act ? ' act' : '') + '" data-game="' + g.id + '">' +
    '<div class="ghead">' +
      '<button class="gtoggle" data-act="togg" data-id="' + g.id + '">' +
        '<span class="ix num">' + g.idx + '</span>' +
        '<span class="mid"><span class="nm">' + label(g) +
          (act ? '<span class="chip live">open</span>' : '<span class="chip done">locked</span>') +
          '</span><span class="meta">' +
          (act ? scored + ' of ' + p.order.length + ' teams scored'
               : (g.elim && g.elim.length ? g.elim.map(teamName).join(', ') + ' knocked out' : 'nobody went out')) +
          (g.note ? ' · ' + esc(g.note) : '') + '</span></span>' +
      '</button>' +
      '<button class="btn sm gho noprsnt" data-act="editgame" data-id="' + g.id + '">Edit</button>' +
      '<button class="iconbtn noprsnt" data-act="togg" data-id="' + g.id + '" title="Expand">' + (open ? '▴' : '▾') + '</button>' +
    '</div>';

  if (!open) return h + '</div>';
  h += '<div class="gbody">';

  const editable = act && canEdit();
  h += p.order.map((o, i) => {
    const t = o.t, v = cell(g.id, t.id), dead = (g.elim || []).indexOf(t.id) >= 0;
    return '<div class="srow' + (zone[t.id] ? ' zone' : '') + (dead ? ' dead' : '') + '" data-team="' + t.id + '">' +
      '<span class="pos num">' + (o.has ? i + 1 : '·') + '</span>' +
      '<span class="nm">' + dot(t) + (t.emoji ? esc(t.emoji) + ' ' : '') + esc(t.name) +
        (dead ? ' 💀' : '') + '</span>' +
      (editable ? '<button class="stp" data-act="step" data-g="' + g.id + '" data-t="' + t.id + '" data-d="-1">−</button>' : '') +
      '<input class="num" type="number" step="any" inputmode="decimal" data-g="' + g.id + '" data-t="' + t.id + '" ' +
        (editable ? '' : 'disabled ') + 'value="' + (v == null ? '' : v) + '" placeholder="–" aria-label="' +
        esc(t.name + ' — ' + g.name) + '">' +
      (editable ? '<button class="stp" data-act="step" data-g="' + g.id + '" data-t="' + t.id + '" data-d="1">+</button>' : '') +
    '</div>';
  }).join('');

  /* lock / unlock */
  if (act) {
    h += '<div class="row noprsnt" style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px">' +
      '<span class="muted" style="font-size:13px">' +
        (p.n === 0 ? 'Nobody can be eliminated — one team left.'
                   : p.n + ' team' + (p.n === 1 ? '' : 's') + ' go out at the end of this game') +
        (p.unscored ? ' · <span style="color:var(--warn)">' + p.unscored + ' still blank</span>' : '') +
      '</span>' +
      '<span style="margin-left:auto;display:flex;gap:8px">' +
      '<button class="btn sm gho" data-act="scoregame" data-id="' + g.id + '">Full screen</button>' +
      '<button class="btn pri" data-act="lock" data-id="' + g.id + '">Lock game & eliminate</button>' +
      '</span></div>';
  } else {
    h += '<div class="row noprsnt" style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px">' +
      '<div class="outlist" style="margin:0">' +
        (g.elim && g.elim.length
          ? g.elim.map(id => { const t = teamById(id); return '<span class="outpill">💀 ' +
              (t && t.emoji ? esc(t.emoji) + ' ' : '') + esc(teamName(id)) + '</span>'; }).join('')
          : '<span class="muted" style="font-size:13px">Nobody was eliminated in this game.</span>') +
      '</div>' +
      '<span style="margin-left:auto"><button class="btn sm" data-act="unlock" data-id="' + g.id + '">Reopen</button></span></div>';
  }

  return h + '</div></div>';
}

/* Typing in a cell must not re-render the card — that would steal focus
   mid-keystroke — so the derived numbers are patched in place instead. */
function repaintGame(gid){
  const g = gameById(gid); if (!g) return;
  const box = document.querySelector('[data-game="' + gid + '"]'); if (!box) return;
  const p = elimPreview(g), zone = {}, pos = {};
  if (g.status !== 'done') p.picks.forEach(x => { if (x.has) zone[x.t.id] = true; });
  p.order.forEach((o, i) => { pos[o.t.id] = o.has ? i + 1 : '·'; });
  box.querySelectorAll('.srow').forEach(row => {
    const tid = row.dataset.team; if (!tid) return;
    const n = row.querySelector('.pos');
    if (n) n.textContent = pos[tid];
    row.classList.toggle('zone', !!zone[tid]);
  });
}

/* ---------- the lock dialog ----------
   The one irreversible-feeling moment in the app, so it shows its work: the
   full order, who the rule picks, and a checkbox on every team in case the
   host wants to overrule it (a tie, a disqualification, a judged game). */
function lockModal(gid){
  const g = gameById(gid); if (!g) return;
  const p = elimPreview(g);
  const picked = {}; p.picks.forEach(x => picked[x.t.id] = true);

  const body =
    (p.unscored ? '<div class="warnbox">' + p.unscored + ' team' + (p.unscored === 1 ? ' has' : 's have') +
      ' no score in this game. Locking now counts them as zero.</div>' : '') +
    (p.tie ? '<div class="warnbox">The cut falls on a tie. Pick who goes out, or reopen the game and play a tie-breaker.</div>' : '') +
    '<div><div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.09em;font-weight:600;margin-bottom:8px">' +
      (state.rules.basis === 'total' ? 'Running total' : 'Game score') + ' — worst first</div>' +
    p.worstFirst.map(x =>
      '<label class="pick' + (picked[x.t.id] ? ' on' : '') + '">' +
        '<input type="checkbox" data-elim="' + x.t.id + '"' + (picked[x.t.id] ? ' checked' : '') + '>' +
        '<span class="nm">' + dot(x.t) + (x.t.emoji ? esc(x.t.emoji) + ' ' : '') + esc(x.t.name) +
          (x.has ? '' : ' <span class="muted" style="font-weight:500">· not scored</span>') + '</span>' +
        '<span class="v num">' + nfmt(x.v) + '</span></label>').join('') +
    '</div>';

  openModal('Lock ' + esc(g.name), body,
    '<button class="btn gho" data-act="closemod">Cancel</button>' +
    '<button class="btn pri" data-act="dolock" data-id="' + g.id + '">Confirm & lock</button>');
}

    '<label class="f"><span>Scoring direction</span><div class="seg">' +
      seg('dir', 'high', 'High score wins', r.direction) +
      seg('dir', 'low',  'Low score wins',  r.direction) + '</div></label>' +
    '<label class="f"><span>Eliminated per game</span>' +
      '<input id="pergame" type="number" min="0" max="5" step="1" value="' + (r.perGame || 1) + '"></label>' +
    '<div class="row"><button class="btn" data-act="saverules">Save rules</button>' +
      '<span class="muted" style="font-size:12.5px">The app never eliminates the last team standing, whatever this says.</span></div>' +
    '</div>';

  /* shared database */
  h += '<div class="sec-head"><h2>Shared database</h2><span class="sub">' +
    (online() ? (cloud.pin ? 'connected · scoring unlocked here' : 'connected · view only on this device')
              : 'optional — everything works offline without it') + '</span></div>';
  h += '<div class="card pad cloudbox">';
  if (!online()) {
    h += '<p class="muted" style="margin:0;font-size:13.5px">Connect a free Supabase project and every phone, laptop and the projector all see one live board. ' +
      'Run <b>supabase-setup.sql</b> in the Supabase SQL editor first.</p>' +
      '<label class="f"><span>Project URL</span><input id="cu" placeholder="https://xxxx.supabase.co"></label>' +
      '<label class="f"><span>Anon public key</span><input id="ck" placeholder="eyJhbGci…"></label>' +
      '<label class="f"><span>Scorer passcode (optional)</span><input id="cp" type="password" placeholder="only needed to enter scores"></label>' +
      '<div id="ctest"></div>' +
      '<div class="row"><button class="btn" data-act="ctest">Test connection</button>' +
      '<button class="btn pri" data-act="connect">Connect</button></div>';
  } else {
    h += '<div class="row"><span class="chip">' + esc(String(cloud.url).replace(/^https?:\/\//, '')) + '</span>' +
      (cloud.pin ? '<span class="chip done">scoring unlocked</span>' : '<span class="chip">view only</span>') + '</div>' +
      '<div class="row">' +
      (cloud.pin ? '' : '<button class="btn pri" data-act="unlock-pin">Enter passcode</button>') +
      '<button class="btn" data-act="viewlink">Copy watch link</button>' +
      (cloud.pin ? '<button class="btn" data-act="scorerlink">Copy scorer link</button>' : '') +
      '<button class="btn" data-act="upload">Upload this device’s data</button>' +
      '<button class="btn gho" data-act="disconnect">Disconnect</button></div>' +
      '<div class="tline' + (net.state === 'error' ? ' bad' : net.state === 'ok' ? ' good' : '') + '">' +
        (net.state === 'error' ? '✗ ' : net.state === 'ok' ? '✓ ' : '○ ') + esc(net.msg) + '</div>' +
      '<div id="ctest"></div>' +
      '<div class="row"><button class="btn" data-act="ctest">Test connection</button>' +
      '<button class="btn gho" data-act="retry">Retry now</button></div>' +
      '<p class="muted" style="margin:0;font-size:12.5px">The watch link carries the project URL and key only — anyone opening it can see the board but not touch it. The scorer link also carries the passcode, so send it only to the people running the games.</p>';
  }
  h += '</div>';

  h += '<div class="sec-head"><h2>Data</h2></div><div class="card pad"><div class="row">' +
    '<button class="btn" data-act="export">Export backup</button>' +
    '<button class="btn" data-act="import">Import backup</button>' +
    '<button class="btn dgr" data-act="restart">Clear all scores</button>' +
    '<button class="btn dgr" data-act="wipe">Delete everything</button></div>' +
    '<p class="muted" style="margin:10px 0 0;font-size:12.5px">“Clear all scores” keeps the teams and games, wipes every score and brings every team back in — the button for a second run of the same event.</p></div>';
  return h;
}

/* ============================ full-screen scorer ============================
   The card list is right on a laptop. On a phone, one game filling the screen
   with a big +/- under your thumb is better, so a game can be opened on its
   own — same rows, nothing else competing for the space.                      */
let curGame = null;

function openScorer(gid){
  const g = gameById(gid); if (!g) return;
  if (g.status === 'done') { toast('Reopen ' + g.name + ' to change its scores'); return; }
  if (!guard()) return;
  curGame = gid;
  $('#scorer').classList.remove('hide');
  paintScorer();
}
function closeScorer(){ curGame = null; $('#scorer').classList.add('hide'); $('#scorer').innerHTML = ''; render(); }

function paintScorer(){
  const g = gameById(curGame); if (!g) { closeScorer(); return; }
  const gs = games(), pos = gs.findIndex(x => x.id === g.id);
  const p = elimPreview(g), zone = {};
  p.picks.forEach(x => { if (x.has) zone[x.t.id] = true; });
  const nextOpen = gs.slice(pos + 1).find(x => x.status !== 'done');
  const prevOpen = gs.slice(0, pos).reverse().find(x => x.status !== 'done');

  $('#scorer').innerHTML =
    '<div class="ovtop"><button class="iconbtn" data-act="closescorer">✕</button>' +
      '<div><div class="t">' + label(g) + '</div>' +
      '<div class="s">Game ' + g.idx + ' of ' + gs.length + ' · ' +
        p.order.filter(o => o.has).length + ' of ' + p.order.length + ' scored</div></div>' +
      '<span style="margin-left:auto" class="chip">' + p.order.length + ' teams</span></div>' +
    '<div class="ovbody">' + p.order.map((o, i) => {
      const t = o.t, v = cell(g.id, t.id);
      return '<div class="srow' + (zone[t.id] ? ' zone' : '') + '">' +
        '<span class="pos num">' + (o.has ? i + 1 : '·') + '</span>' +
        '<span class="nm">' + dot(t) + (t.emoji ? esc(t.emoji) + ' ' : '') + esc(t.name) + '</span>' +
        '<button class="stp" data-act="step" data-g="' + g.id + '" data-t="' + t.id + '" data-d="-1">−</button>' +
        '<input class="num" type="number" step="any" inputmode="decimal" data-g="' + g.id + '" data-t="' + t.id +
          '" value="' + (v == null ? '' : v) + '" placeholder="–">' +
        '<button class="stp" data-act="step" data-g="' + g.id + '" data-t="' + t.id + '" data-d="1">+</button>' +
      '</div>';
    }).join('') + '</div>' +
    '<div class="ovbot">' +
      (prevOpen ? '<button class="btn" data-act="gonext" data-id="' + prevOpen.id + '">← ' + esc(prevOpen.name) + '</button>' : '') +
      '<span style="margin-left:auto;display:flex;gap:8px">' +
      '<button class="btn pri" data-act="lockfrom" data-id="' + g.id + '">Lock & eliminate</button>' +
      (nextOpen ? '<button class="btn" data-act="gonext" data-id="' + nextOpen.id + '">' + esc(nextOpen.name) + ' →</button>' : '') +
      '</span></div>';
}

/* ============================ confirm ============================ */
let pendingConfirm = null;
function confirmModal(title, msg, lbl, fn){
  pendingConfirm = fn;
  openModal(title, '<p style="margin:0;font-size:14px">' + msg + '</p>',
    '<button class="btn gho" data-act="closemod">Cancel</button>' +
    '<button class="btn dgr" data-act="doconfirm">' + lbl + '</button>');
